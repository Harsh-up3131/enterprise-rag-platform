<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .b  { rx: 12; stroke-width: 2; }
      .t  { fill: #0f172a; font-size: 15px; font-weight: 600; text-anchor: middle; }
      .s  { fill: #64748b; font-size: 11.5px; text-anchor: middle; }
      .h  { fill: #475569; font-size: 12px; font-weight: 700; letter-spacing: .1em; }
      .e  { stroke: #94a3b8; stroke-width: 2; fill: none; marker-end: url(#a); }
      .n  { fill: #94a3b8; font-size: 13px; font-weight: 700; text-anchor: middle; }
    </style>
  </defs>
  <rect width="960" height="520" fill="#fff"/>
  <text x="480" y="40" class="t" font-size="21">How the RAG System Works</text>
  <text x="480" y="62" class="s">Retrieval-Augmented Generation: look it up first, then answer only from what you found</text>

  <!-- Row 1: indexing -->
  <text class="h" x="50" y="106">ONCE PER DOCUMENT — INDEXING</text>
  <rect class="b" x="50" y="120" width="180" height="76" fill="#fff7ed" stroke="#f97316"/>
  <text class="n" x="66" y="140">1</text>
  <text class="t" x="140" y="155">Document</text>
  <text class="s" x="140" y="176">a PDF, note or report</text>

  <rect class="b" x="270" y="120" width="180" height="76" fill="#fff7ed" stroke="#f97316"/>
  <text class="n" x="286" y="140">2</text>
  <text class="t" x="360" y="155">Split into chunks</text>
  <text class="s" x="360" y="176">small, self-contained pieces</text>

  <rect class="b" x="490" y="120" width="180" height="76" fill="#fff7ed" stroke="#f97316"/>
  <text class="n" x="506" y="140">3</text>
  <text class="t" x="580" y="155">Turn into vectors</text>
  <text class="s" x="580" y="176">meaning, as numbers</text>

  <rect class="b" x="710" y="120" width="200" height="76" fill="#f1f5f9" stroke="#475569"/>
  <text class="n" x="726" y="140">4</text>
  <text class="t" x="810" y="155">Store &amp; index</text>
  <text class="s" x="810" y="176">searchable knowledge base</text>

  <path class="e" d="M234 158 L266 158"/>
  <path class="e" d="M454 158 L486 158"/>
  <path class="e" d="M674 158 L706 158"/>

  <!-- Row 2: query -->
  <text class="h" x="50" y="256">EVERY TIME SOMEONE ASKS — ANSWERING</text>
  <rect class="b" x="50" y="270" width="180" height="76" fill="#eef2ff" stroke="#6366f1"/>
  <text class="n" x="66" y="290">5</text>
  <text class="t" x="140" y="305">Question</text>
  <text class="s" x="140" y="326">asked by a user</text>

  <rect class="b" x="270" y="270" width="180" height="76" fill="#faf5ff" stroke="#a855f7"/>
  <text class="n" x="286" y="290">6</text>
  <text class="t" x="360" y="305">Search</text>
  <text class="s" x="360" y="322">by keyword AND by meaning</text>
  <text class="s" x="360" y="338">— only what you may see</text>

  <rect class="b" x="490" y="270" width="180" height="76" fill="#faf5ff" stroke="#a855f7"/>
  <text class="n" x="506" y="290">7</text>
  <text class="t" x="580" y="305">Rank the best</text>
  <text class="s" x="580" y="326">merge results, keep the top few</text>

  <rect class="b" x="710" y="270" width="200" height="76" fill="#f0fdf4" stroke="#16a34a"/>
  <text class="n" x="726" y="290">8</text>
  <text class="t" x="810" y="305">Evidence pack</text>
  <text class="s" x="810" y="326">the passages worth reading</text>

  <path class="e" d="M234 308 L266 308"/>
  <path class="e" d="M454 308 L486 308"/>
  <path class="e" d="M674 308 L706 308"/>
  <path class="e" d="M810 200 L810 266" stroke-dasharray="5 4"/>
  <text class="s" x="866" y="238">searched</text>

  <!-- Row 3: generation -->
  <rect class="b" x="710" y="392" width="200" height="76" fill="#f0fdf4" stroke="#16a34a"/>
  <text class="n" x="726" y="412">9</text>
  <text class="t" x="810" y="427">LLM writes answer</text>
  <text class="s" x="810" y="448">using only that evidence</text>

  <rect class="b" x="440" y="392" width="220" height="76" fill="#f0fdf4" stroke="#16a34a"/>
  <text class="n" x="456" y="412">10</text>
  <text class="t" x="550" y="427">Check the sources</text>
  <text class="s" x="550" y="448">claimed sources must be real</text>

  <rect class="b" x="180" y="392" width="210" height="76" fill="#ecfeff" stroke="#0891b2"/>
  <text class="n" x="196" y="412">11</text>
  <text class="t" x="285" y="427">Answer + citations</text>
  <text class="s" x="285" y="448">or an honest "I don't know"</text>

  <path class="e" d="M810 350 L810 388"/>
  <path class="e" d="M706 430 L664 430"/>
  <path class="e" d="M436 430 L394 430"/>

  <rect class="b" x="50" y="392" width="110" height="76" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="6 4"/>
  <text class="t" x="105" y="422" font-size="13">Abstain</text>
  <text class="s" x="105" y="442">weak or</text>
  <text class="s" x="105" y="456">unverified</text>
  <path class="e" d="M176 430 L164 430" stroke="#dc2626"/>

  <text x="480" y="500" class="s">The model never answers from memory alone — no supporting passage means no answer.</text>
</svg>
