<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .b { rx: 12; stroke-width: 2; }
      .t { fill: #0f172a; font-size: 16px; font-weight: 600; text-anchor: middle; }
      .s { fill: #64748b; font-size: 12px; text-anchor: middle; }
      .e { stroke: #94a3b8; stroke-width: 2; fill: none; marker-end: url(#a); }
      .el { fill: #64748b; font-size: 11px; text-anchor: middle; }
    </style>
  </defs>
  <rect width="900" height="470" fill="#fff"/>
  <text x="450" y="42" class="t" font-size="21">EKIP — High-Level Architecture</text>
  <text x="450" y="64" class="s">Ask questions about your own documents, and get answers you can trace back to them</text>

  <!-- User -->
  <rect class="b" x="60" y="110" width="180" height="80" fill="#eef2ff" stroke="#6366f1"/>
  <text class="t" x="150" y="145">User</text>
  <text class="s" x="150" y="166">upload docs · ask questions</text>

  <!-- Platform -->
  <rect class="b" x="330" y="96" width="240" height="108" fill="#ecfeff" stroke="#0891b2"/>
  <text class="t" x="450" y="132">Platform</text>
  <text class="s" x="450" y="154">answers every request only</text>
  <text class="s" x="450" y="170">with what that user is</text>
  <text class="s" x="450" y="186">allowed to see</text>

  <!-- Knowledge base -->
  <rect class="b" x="660" y="110" width="180" height="80" fill="#f1f5f9" stroke="#475569"/>
  <text class="t" x="750" y="145">Knowledge Base</text>
  <text class="s" x="750" y="166">documents, split &amp; indexed</text>

  <!-- three pillars -->
  <rect class="b" x="60" y="270" width="230" height="120" fill="#fff7ed" stroke="#f97316"/>
  <text class="t" x="175" y="304">Ingestion</text>
  <text class="s" x="175" y="328">documents are read, split</text>
  <text class="s" x="175" y="346">and indexed in the background</text>
  <text class="s" x="175" y="370">— searchable only when complete</text>

  <rect class="b" x="335" y="270" width="230" height="120" fill="#f0fdf4" stroke="#16a34a"/>
  <text class="t" x="450" y="304">Answering</text>
  <text class="s" x="450" y="328">finds the most relevant passages,</text>
  <text class="s" x="450" y="346">answers only from them,</text>
  <text class="s" x="450" y="370">and says "I don't know" otherwise</text>

  <rect class="b" x="610" y="270" width="230" height="120" fill="#fef2f2" stroke="#dc2626"/>
  <text class="t" x="725" y="304">Trust</text>
  <text class="s" x="725" y="328">every answer is traced,</text>
  <text class="s" x="725" y="346">measured for quality,</text>
  <text class="s" x="725" y="370">and isolated per organization</text>

  <path class="e" d="M244 150 L326 150"/>
  <path class="e" d="M574 150 L656 150"/>
  <path class="e" d="M660 168 C600 200, 500 175, 452 200" stroke-dasharray="5 4"/>
  <text class="el" x="450" y="228">↓ what the platform is made of</text>
  <path class="e" d="M175 208 L175 266" stroke-dasharray="5 4"/>
  <path class="e" d="M450 208 L450 266" stroke-dasharray="5 4"/>
  <path class="e" d="M725 208 L725 266" stroke-dasharray="5 4"/>

  <text x="450" y="432" class="s">Every document, chunk and query belongs to exactly one organization — tenants never share data.</text>
</svg>
