name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Python audit tooling
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
      - name: Install frontend audit tooling
        run: |
          cd frontend
          npm install --no-save
      - name: Run security audit
        run: python scripts/run_security_audit.py
