name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install
      - name: Run backend tests
        run: pytest -q tests/test_security_hardening.py tests/test_config_hardening.py tests/test_prompt_guardrails.py tests/test_evaluation_monitoring.py tests/test_quality_history.py tests/test_rate_limiting.py
      - name: Build frontend
        run: |
          cd frontend
          npm run build
